name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Write version file
        shell: pwsh
        run: |
          Set-Content -Path VERSION -Value "${{ github.ref_name }}"

      - name: Build Windows application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name "QA-Monitoring-Tool" `
            --collect-all streamlit `
            --copy-metadata streamlit `
            --add-data "app.py;." `
            --add-data "VERSION;." `
            desktop_launcher.py

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\QA-Monitoring-Tool" `
            -DestinationPath "QA-Monitoring-Tool-Windows.zip" `
            -Force

      - name: Attach package to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"

          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload `
              $tag `
              "QA-Monitoring-Tool-Windows.zip" `
              --clobber
          }
          else {
            gh release create `
              $tag `
              "QA-Monitoring-Tool-Windows.zip" `
              --title "QA Monitoring Tool $tag" `
              --generate-notes
          }
